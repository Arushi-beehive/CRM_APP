
     <ion-item lines="none" class="ion-no-padding">
      <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
    </ion-item>
<ion-content class="ion-padding">
  <ion-item lines="none" class="ion-no-padding">
   <h1>New Number</h1>
  </ion-item>

  <form [formGroup]="loginForm" (ngSubmit)="sendOtp()">
    <ion-grid
      class="ion-justify-content-center ion-no-margin"
    >
      <ion-row>
        <ion-col size="2">
          <ion-input
            type="tel"
            formControlName="country_code"
            class="border-box ion-padding-start"
            maxlength="5"
          
          ></ion-input>
        </ion-col>
        <ion-col size="8">
          <ion-input
            type="tel"
            class="border-box"
            formControlName="mobileNumber"
            placeholder="Enter New Mobile No"
            maxlength="10"
            (ionInput)="onlyDigits($event)"
          ></ion-input>
        </ion-col>
        <ion-col size="2">
          <button
            type="button"
            class="input-group-text"
            (click)="clearNumber()"
          >
            <ion-icon name="close-outline"></ion-icon></button
        ></ion-col>
        <ion-col size="12">
          <ion-text
            *ngIf="country_code?.invalid && (country_code?.touched)"
            class="danger ion-margin-bottom"
          >
            Country code must start with + and contain only digits (e.g. +91)
          </ion-text>
        </ion-col>
        <ion-col size="12">
          <ion-text
            *ngIf="mobileNumber?.invalid && (mobileNumber?.touched || mobileNumber.dirty)"
            class="danger ion-margin-bottom"
          >
            Please enter a valid 10-digit mobile number.
          </ion-text>
        </ion-col>

        <ion-col size="12">
          <ion-button
            type="submit"
            expand="block"
            [disabled]="loginForm.invalid"
          >
           Change Number
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
  <ion-footer class="ion-no-border">
    <p>
      Having trouble logging in?
      <ion-text color="primary">Get Help</ion-text>
    </p>
  </ion-footer>
</ion-content>
