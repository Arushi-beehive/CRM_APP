<ion-toolbar color="primary" class="shadow-sm rounded-bottom">
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-between">
      <ion-col size="auto">
        <div class="d-flex ion-align-items-center ion-justify-content-start">
          <!-- <ion-img src="assets/Logo_only.png" alt="Logo" class="logo-sm" > -->
          <ion-title size="small"> Hi Chittaranjan! </ion-title>
        </div>
      </ion-col>

      <ion-col size="auto">
        <ion-buttons>
          <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
        </ion-buttons>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-toolbar>

<ion-content>
  <form [formGroup]="referralForm">
  <ion-item lines="none">
    <h1>My Referral</h1>
  </ion-item>
  <ion-grid>
    <ion-row>
      <ion-col class="border-box">
        <strong>Name</strong>
      </ion-col>
      <ion-col class="border-box">
        <strong>Mobile No</strong>
      </ion-col>
      <ion-col class="border-box">
        <strong>Status</strong>
      </ion-col>
      <ion-col class="border-box">
        <strong>Plan</strong>
      </ion-col>
    </ion-row>
    <ion-row *ngFor="let user of users">
      <ion-col size="3" class="border-box">{{user.name}}</ion-col>
      <ion-col size="3" class="border-box">{{user.mobile}}</ion-col>
      <ion-col size="3" class="border-box">{{user.status}}</ion-col>
      <ion-col size="3" class="border-box">{{user.plan}}</ion-col>
    </ion-row>
  </ion-grid>
  <ion-grid>
    <ion-row>
     <ion-col size="12">
      <ion-item lines="none" class="border-box">
        <ion-label>Total Wallet Balance</ion-label>
        <ion-input type="number" formControlName="totalWallet"></ion-input>
      </ion-item>  
     </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="8">
        <ion-item lines="none" class="border-box">
        <ion-label>Redeem Amount</ion-label>
        <ion-input type="number" formControlName="redeemAmount"></ion-input>
      </ion-item>  
      </ion-col>
      <ion-col size="4">
        <ion-button type="button" expand="block">Request</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
  </form>
</ion-content>
