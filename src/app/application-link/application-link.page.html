 <ion-item lines="none" class="ion-no-padding">
      <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
    </ion-item>
<ion-content class="ion-padding">
  <ion-item lines="none" class="ion-no-padding">
   <h1>Application Link</h1>
  </ion-item>
 
   <form [formGroup]="applicationForm">
    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-item lines="none" class="border-box">
          <ion-icon name="close-outline" slot="end" size="small" (click)="cancel()"></ion-icon>
 <ion-input type="text" formControlName="link" placeholder="Application Link"></ion-input>
 </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-button expand="block" type="button" name="share-social-oitline">
            <ion-icon name="share-social-outline" slot="end" size="small"></ion-icon>
            Share
          </ion-button>
        </ion-col>
<ion-col size="6">
 <ion-button expand="block" type="button">
  <ion-icon name="copy-outline" slot="end" size="small"></ion-icon>
  Copy</ion-button>
</ion-col>
      </ion-row>
    </ion-grid>
    

   </form>
</ion-content>
